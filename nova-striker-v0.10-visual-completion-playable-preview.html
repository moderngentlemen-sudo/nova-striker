 {name:"SKYPORT",acts:["TRANSIT SPINE","MAINTENANCE INTERIOR","UPPER SKYLINE"],colors:["#07172e","#173458","#4eb2d8"],music:"skylinePulse",boss:"aegis",hazard:"laser",minis:["railSentinel","vectorHound"],enemyPalette:["#e06d51","#b54d67","#7bd7ee"],bossColor:"#58c8ec",setpiece:"trainRush"},
 {name:"EMBER WORKS",acts:["FURNACE WALK","FOUNDRY SHAFT","CORE FORGE"],colors:["#251017","#63291d","#ff7047"],music:"moltenCircuit",boss:"cinder",hazard:"vent",minis:["bulwark","vectorHound"],enemyPalette:["#d75134","#ff873f","#853f31"],bossColor:"#ff6639",setpiece:"furnaceSurge"},

function ensureAudio(){if(audioCtx){audioCtx.resume?.();return}const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}
function tone(freq,duration=.12,volume=.018){if(!audioCtx||!save.settings.music)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=currentSector===5?"sawtooth":currentSector===2?"triangle":"square";o.frequency.value=freq;g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}
function updateMusic(dt){if(mode!=="play"||!audioCtx||!save.settings.music)return;const t=MUSIC[SECTORS[currentSector].music],bpm=t.bpm*[1,1.06,1.12][currentAct]*(musicBossMode?1.2:1);musicTimer-=dt;if(musicTimer>0)return;musicTimer+=60/bpm/2;const semi=t.pattern[musicStep%t.pattern.length],oct=currentAct===2&&musicStep%4===0?12:0;tone(t.root*Math.pow(2,(semi+oct)/12),musicBossMode?.09:.13,musicBossMode?.027:.018);musicStep++}

/* VFX */
const particles=[],afterimages=[],speedLines=[],damageTexts=[],banners=[],debris=[];
function burst(x,y,color,count=12,speed=180){if(save.settings.reducedMotion)count=Math.ceil(count*.35);for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*speed;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,color,size:rand(2,5)})}}

function addSpeedLines(p,count=8){if(save.settings.reducedMotion)return;for(let i=0;i<count;i++)speedLines.push({x:p.x+rand(-80,80),y:p.y+rand(-40,80),vx:-p.vx*.4,vy:-p.vy*.4,life:.12,color:p.color})}

/* INPUT */
const controllerSlots=[null,null];
function pads(){return [...navigator.getGamepads()].filter(Boolean)}
function btn(gp,i){const b=gp?.buttons?.[i];return !!b&&(b.pressed||b.value>.45)}
function neutralInput(){return{moveX:0,moveY:0,aimX:1,aimY:0,aimActive:false,jump:false,fire:false,dash:false,melee:false,parry:false,ability:false,cycleWeapon:false,cycleGuardian:false,sync:false,pause:false}}
function assignControllers(){const list=pads(),connected=new Set(list.map(p=>p.index));for(let s=0;s<2;s++)if(controllerSlots[s]!==null&&!connected.has(controllerSlots[s]))controllerSlots[s]=null;if(controllerSlots[0]===null&&list.length)controllerSlots[0]=list[0].index;const used=new Set(controllerSlots.filter(v=>v!==null));for(const gp of list){if(used.has(gp.index))continue;if(btn(gp,0)||btn(gp,9)){controllerSlots[1]=gp.index;if(mode==="play")joinPlayerTwo();break}}}
function keyboardInput(){let ax=0,ay=0;if(keys.has("ArrowLeft"))ax--;if(keys.has("ArrowRight"))ax++;if(keys.has("ArrowUp"))ay--;if(keys.has("ArrowDown"))ay++;const aim=norm(ax,ay);return{moveX:(keys.has("KeyD")?1:0)-(keys.has("KeyA")?1:0),moveY:(keys.has("KeyS")?1:0)-(keys.has("KeyW")?1:0),aimX:aim.x,aimY:aim.y,aimActive:Math.abs(ax)+Math.abs(ay)>0,jump:keys.has("Space"),fire:keys.has("KeyJ"),dash:keys.has("KeyK"),melee:keys.has("KeyU"),parry:keys.has("KeyI"),ability:keys.has("KeyF"),cycleWeapon:keys.has("KeyQ"),cycleGuardian:keys.has("KeyR"),sync:keys.has("KeyG"),pause:keys.has("Escape")}}
function controllerInput(index){const gp=navigator.getGamepads()[index];if(!gp)return neutralInput();let mx=gp.axes[0]||0,my=gp.axes[1]||0;const dx=(btn(gp,15)?1:0)-(btn(gp,14)?1:0),dy=(btn(gp,13)?1:0)-(btn(gp,12)?1:0);if(Math.hypot(mx,my)<MOVE_DEADZONE){mx=dx;my=dy}let ax=gp.axes[2]||0,ay=gp.axes[3]||0;const m=Math.hypot(ax,ay),aimActive=m>=AIM_DEADZONE;if(aimActive){ax/=m;ay/=m}else{ax=0;ay=0}return{moveX:mx,moveY:my,aimX:ax,aimY:ay,aimActive,jump:btn(gp,0),parry:btn(gp,1),melee:btn(gp,2),ability:btn(gp,4),cycleWeapon:btn(gp,5),dash:btn(gp,6),fire:btn(gp,7),pause:btn(gp,9),cycleGuardian:btn(gp,10),sync:btn(gp,11)}}
function combineInputs(a,b){return{moveX:Math.abs(b.moveX)>Math.abs(a.moveX)?b.moveX:a.moveX,moveY:Math.abs(b.moveY)>Math.abs(a.moveY)?b.moveY:a.moveY,aimX:b.aimActive?b.aimX:a.aimX,aimY:b.aimActive?b.aimY:a.aimY,aimActive:a.aimActive||b.aimActive,jump:a.jump||b.jump,fire:a.fire||b.fire,dash:a.dash||b.dash,melee:a.melee||b.melee,parry:a.parry||b.parry,ability:a.ability||b.ability,cycleWeapon:a.cycleWeapon||b.cycleWeapon,cycleGuardian:a.cycleGuardian||b.cycleGuardian,sync:a.sync||b.sync,pause:a.pause||b.pause}}

/* PROCEDURAL SPRITES */
const PLAYER_STATES=["idle","run","backpedal","jump","fall","land","crouch","slide","dash","wall","parry","melee1","melee2","melee3","air1","air2","dive"];
const PW=32,PH=48;
const playerAtlas=document.createElement("canvas");playerAtlas.width=PW*4;playerAtlas.height=PH*PLAYER_STATES.length*2;const pctx=playerAtlas.getContext("2d");
function px(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}
function makePlayerAtlas(){const pal=[{armor:"#3ec4ff",dark:"#146793",glow:"#8beeff",face:"#e6fbff"},{armor:"#ff983d",dark:"#a64e18",glow:"#ffd27e",face:"#fff2de"}];pal.forEach((p,pi)=>PLAYER_STATES.forEach((state,si)=>{for(let f=0;f<4;f++){const ox=f*PW,oy=(pi*PLAYER_STATES.length+si)*PH;let ty=12,crouch=state==="crouch"||state==="slide";if(crouch)ty=25;let leg=state==="run"||state==="backpedal"?(f%2?3:-2):0;if(!crouch){px(pctx,ox+7,oy+33,7,12+leg,p.dark);px(pctx,ox+18,oy+33,7,12-leg,p.dark)}px(pctx,ox+7,oy+ty,18,crouch?14:24,p.armor);px(pctx,ox+6,oy+(crouch?16:4),20,12,p.armor);px(pctx,ox+18,oy+(crouch?20:8),6,4,p.face);if(state.startsWith("melee")||state.startsWith("air")||state==="dive")px(pctx,ox+21,oy+ty+5,10+f*2,6,p.glow);else px(pctx,ox+23,oy+ty+7,8,7,p.glow);if(state==="slide")px(pctx,ox+3,oy+39,27,6,p.dark);if(state==="parry"){pctx.strokeStyle=p.glow;pctx.strokeRect(ox+3,oy+2,26,42)}if(state==="land")px(pctx,ox+5,oy+40,22,4,p.glow)}}))}
makePlayerAtlas();

const ENEMY_TYPES=["walker","turret","drone","shield","hopper","sniper","charger","orbiter","heavy","wallHunter","guard","interceptor"];
const EW=40,EH=48;
const enemyAtlas=document.createElement("canvas");enemyAtlas.width=EW*4;enemyAtlas.height=EH*ENEMY_TYPES.length*SECTORS.length*3;const ectx=enemyAtlas.getContext("2d");
function makeEnemyAtlas(){
  SECTORS.forEach((sector,si)=>{
    ENEMY_TYPES.forEach((type,ti)=>{
      ["idle","hurt","death"].forEach((state,sti)=>{
        for(let f=0;f<4;f++){
          const ox=f*EW;
          const oy=((si*ENEMY_TYPES.length*3)+(ti*3)+sti)*EH;
          const base=sector.enemyPalette[ti%sector.enemyPalette.length];
          const dark=sector.colors[1];
          const bob=(type==="drone"||type==="orbiter")?(f%2?2:-2):0;
          const alpha=state==="death"?1-f*.2:1;
          ectx.globalAlpha=alpha;
          px(ectx,ox+7,oy+11+bob,26,state==="death"?18:(type==="heavy"?30:24),state==="hurt"?"#fff":base);
          px(ectx,ox+10,oy+7+bob,20,10,dark);
          px(ectx,ox+13,oy+11+bob,14,4,"#fff08a");
          if(!["drone","orbiter","turret"].includes(type)&&state!=="death"){
            const stride=f%2?3:-2;
            px(ectx,ox+10,oy+34,7,10+stride,dark);
            px(ectx,ox+23,oy+34,7,10-stride,dark);
          }
          if(type==="shield") px(ectx,ox+1,oy+12,7,28,"#bceaff");
          if(type==="sniper") px(ectx,ox+29,oy+17,10,5,"#ffcf77");
          ectx.globalAlpha=1;
        }
      });
    });
  });
}
makeEnemyAtlas();

/* BOSS + MINI-BOSS ATLAS */
const BOSS_TYPES=["aegis","cinder","mycel","rime","tempest","null","bulwark","vectorHound","cliffStalker","railSentinel"];
const BW=96,BH=112;

function makeBossAtlas(){BOSS_TYPES.forEach((type,ti)=>{const sector=Math.min(ti,5),base=SECTORS[sector]?.bossColor||"#e08b59",dark=SECTORS[sector]?.colors[1]||"#633",glow=SECTORS[sector]?.colors[2]||"#fff";for(let f=0;f<4;f++){const ox=f*BW,oy=ti*BH,bob=(f%2?2:-1);px(bctx,ox+20,oy+25+bob,56,58,base);px(bctx,ox+27,oy+12+bob,42,26,dark);px(bctx,ox+35,oy+21+bob,26,7,"#fff3a0");px(bctx,ox+8,oy+38+bob,18,38,base);px(bctx,ox+70,oy+38+bob,18,38,base);px(bctx,ox+24,oy+80,16,24,dark);px(bctx,ox+56,oy+80,16,24,dark);if(["tempest","null","vectorHound"].includes(type)){bctx.strokeStyle=glow;bctx.strokeRect(ox+10,oy+8,76,90)}if(type==="cinder")px(bctx,ox+5,oy+60,15+f*4,8,"#ff6d37");if(type==="mycel"){px(bctx,ox+6,oy+18,10,10,"#8cff8d");px(bctx,ox+80,oy+18,10,10,"#8cff8d")}}})}

/* ACTORS */
class Player{constructor(id,color){this.id=id;this.color=color;this.active=id===0;this.x=150-id*45;this.y=580;this.w=30;this.h=52;this.standH=52;this.crouchH=30;this.vx=0;this.vy=0;this.facing=1;this.aimX=1;this.aimY=0;this.health=100;this.maxHealth=100;this.downed=false;this.reviveProgress=0;this.invuln=0;this.barrier=0;this.grounded=false;this.wasGrounded=false;this.groundPlatform=null;this.crouching=false;this.touchWallLeft=false;this.touchWallRight=false;this.airJump=1;this.airDash=1;this.dropTimer=0;this.wallRegrab=0;this.dashCharge=0;this.dashTimer=0;this.dashTier=0;this.dashDir={x:1,y:0};this.dashHits=new Set();this.slideTimer=0;this.slideHits=new Set();this.fireCharge=0;this.parryElapsed=-1;this.meleeTimer=0;this.meleeStep=0;this.meleeReset=0;this.meleeHits=new Set();this.airMeleeStep=0;this.airMeleeReset=0;this.landingTimer=0;this.weaponIndex=0;this.guardianIndex=0;this.guardianCooldown=0;this.powerTimer=0;this.rapidTimer=0;this.velocityTimer=0;this.prev={}}
rect(){return{x:this.x,y:this.y,w:this.w,h:this.h}}center(){return{x:this.x+this.w/2,y:this.y+this.h/2}}bottom(){return this.y+this.h}setHeight(h){const b=this.bottom();this.h=h;this.y=b-h}edge(r,k){return !!r[k]&&!this.prev[k]}released(r,k){return !r[k]&&!!this.prev[k]}remember(r){this.prev={...r}}weapon(){const ids=save.unlockedWeapons,id=ids[this.weaponIndex%ids.length];return{id,...WEAPONS[id]}}guardian(){const ids=save.unlockedGuardians,id=ids[this.guardianIndex%ids.length];return{id,...GUARDIANS[id]}}}

25)particles.push({x:p.x+(wallDir<0?0:p.w),y:p.y+p.h-6,vx:rand(-20,20),vy:rand(20,90),life:.25,color:"#d8ecff",size:2})}if(jumpPressed&&!(p.crouching&&p.groundPlatform?.type==="oneway")){if(p.grounded){p.vy=-JUMP_SPEED;p.grounded=false;p.airJump=1;p.airDash=1}else if(wallDir!==0&&p.wallRegrab<=0){p.vx=-wallDir*WALL_JUMP_X;p.vy=-WALL_JUMP_Y;p.facing=-wallDir;p.wallRegrab=.12;if(save.skills.wallDynamo)p.airDash=1;burst(p.x+p.w/2,p.y+p.h/2,"#dff7ff",14,190)}else if(p.airJump>0){p.airJump--;p.vy=-JUMP_SPEED*.92}}if(raw.dash&&p.dashTimer<=0&&p.slideTimer<=0)p.dashCharge+=dt*(save.skills.dashCapacitor?1.2:1);if(dashReleased&&p.dashCharge>0){const tier=dashTier(p.dashCharge);if(p.crouching&&p.grounded)beginSlide(p,tier);else beginDash(p,tier,raw.moveX,raw.moveY);p.dashCharge=0}if(parryPressed&&p.parryElapsed<0)p.parryElapsed=0;if(meleePressed){if(!p.grounded&&p.aimY>.55&&p.airMeleeReset<=0){p.airMeleeStep=3;p.meleeStep=3;p.meleeTimer=.22;p.airMeleeReset=.45;p.meleeHits.clear()}else beginMelee(p)}if(raw.ability){const ally=players.find(o=>o!==p&&o.active&&o.downed&&Math.hypot(o.x-p.x,o.y-p.y)<100);if(ally){ally.reviveProgress+=dt;const req=save.skills.medicProtocol?.75:1.15;if(ally.reviveProgress>=req)revivePlayer(ally)}else if(abilityPressed)useGuardian(p)}if(raw.fire)p.fireCharge+=dt*(p.rapidTimer>0?1.25:1)*(save.skills.overchargeDrive?1.15:1);if(p.released(raw,"fire")){let tier=0;if(p.fireCharge>=SHOT_T3)tier=3;else if(p.fireCharge>=SHOT_T2)tier=2;else if(p.fireCharge>=SHOT_T1)tier=1;fireWeapon(p,tier);p.fireCharge=0}if(syncPressed)triggerSynergy();if(p.slideTimer>0){p.slideTimer-=dt;const speed=p.dashTier===1?590:p.dashTier===2?735:910;p.vx=p.dashDir.x*speed;p.vy=0;addSpeedLines(p,6);afterimages.push({x:p.x,y:p.y,w:p.w,h:p.h,color:p.color,life:.14});if(p.slideTimer<=0&&standingClear(p)){p.setHeight(p.standH);p.crouching=false}}else if(p.dashTimer>0){p.dashTimer-=dt;const speed=(p.dashTier===1?720:p.dashTier===2?890:1090)*(p.velocityTimer>0?1.15:1);p.vx=p.dashDir.x*speed;p.vy=p.dashDir.y*speed;addSpeedLines(p,7);afterimages.push({x:p.x,y:p.y,w:p.w,h:p.h,color:p.color,life:.14})}else{const speed=(p.crouching?CROUCH_SPEED:RUN_SPEED)*(p.velocityTimer>0?1.18:1);p.vx=lerp(p.vx,raw.moveX*speed,1-Math.pow(.0004,dt));if(!p.grounded)p.vy+=GRAVITY*dt}resolveMovement(p,dt);if(p.grounded){p.airJump=1;p.airDash=1}updateDashDamage(p);updateMeleeDamage(p);p.remember(raw)}

/* DASH/MELEE DAMAGE */
function updateDashDamage(p){if(!(p.slideTimer>0||(p.dashTimer>0&&p.dashTier===3)))return;const set=p.slideTimer>0?p.slideHits:p.dashHits;for(const e of enemies){if(e.dead||set.has(e)||!overlap(p.rect(),e.rect()))continue;set.add(e);const dmg=p.slideTimer>0?12+p.dashTier*6:24;e.health-=dmg;e.hurtTimer=.12;let stun=p.slideTimer>0?.55+p.dashTier*.2:.4;if(save.skills.slideReactor&&p.slideTimer>0)stun*=1.3;e.stun=Math.max(e.stun,stun);knockEnemy(e,p.dashDir.x*(180+p.dashTier*70),-90);damageText(e.x,e.y-8,Math.round(dmg),"#7ceaff");burst(e.x+e.w/2,e.y+e.h/2,"#72eaff",18,240);synergy=clamp(synergy+2,0,100)}for(const d of destructibles){if(d.broken||set.has(d))continue;if(overlap(p.rect(),d.rect())){set.add(d);damageDestructible(d,p.dashTier===3?80:24,p.dashTier)}}for(const m of miniBosses){if(!m.active||m.dead||set.has(m))continue;if(overlap(p.rect(),m.rect())){set.add(m);if(m.health<=m.maxHealth*.18&&p.dashTier===3)executeFinisher(p,m,"VECTOR EXECUTION");else{m.health-=16+p.dashTier*4;m.stun=Math.max(m.stun,.25)}}}if(boss&&!boss.dead&&!set.has(boss)&&overlap(p.rect(),boss.rect())){set.add(boss);if(boss.health<=boss.maxHealth*.12&&p.dashTier===3)executeFinisher(p,boss,"VELOCITY FINISH");else{boss.health-=p.slideTimer>0?16:22;boss.stun=Math.max(boss.stun,.15)}shake(5)}if(p.dashTier===3)for(const s of secrets)if(!s.opened&&overlap(p.rect(),s))openSecret(s)}
function updateMeleeDamage(p){if(!(p.meleeTimer>0&&p.meleeTimer<.15&&p.meleeTimer>.045))return;const hb=meleeHitbox(p),air=!p.grounded;for(const e of enemies){if(e.dead||p.meleeHits.has(e)||!overlap(hb,e.rect()))continue;p.meleeHits.add(e);let dmg=air?(10+p.airMeleeStep*5):(9+p.meleeStep*4);if(p.meleeStep===3&&save.skills.counterstrike&&p.parryElapsed>=0&&p.parryElapsed<.6)dmg*=1.55;e.health-=dmg;e.hurtTimer=.12;e.stun=Math.max(e.stun,p.meleeStep===3?.55:.22);let kx=p.facing*(p.meleeStep===3?260:120),ky=p.meleeStep===3?-210:-60;if(air){kx*=.75;ky=p.aimY>.45?320:-180;if(save.skills.aerialMastery)dmg*=1.15}knockEnemy(e,kx,ky);damageText(e.x,e.y-8,Math.round(dmg),"#ffe695");burst(e.x+e.w/2,e.y+e.h/2,"#ffe695",16,220);synergy=clamp(synergy+3,0,100);hitStop=.03;shake(4)}for(const d of destructibles){if(d.broken||p.meleeHits.has(d)||!overlap(hb,d.rect()))continue;p.meleeHits.add(d);damageDestructible(d,p.meleeStep===3?35:15,0)}for(const m of miniBosses){if(!m.active||m.dead||p.meleeHits.has(m)||!overlap(hb,m.rect()))continue;p.meleeHits.add(m);if(m.health<=m.maxHealth*.18&&p.meleeStep===3)executeFinisher(p,m,"ELITE BREAK");else{m.health-=11+p.meleeStep*4;m.stun=Math.max(m.stun,.15)}}if(boss&&!boss.dead&&!p.meleeHits.has(boss)&&overlap(hb,boss.rect())){p.meleeHits.add(boss);if(boss.health<=boss.maxHealth*.12&&p.meleeStep===3)executeFinisher(p,boss,"FINAL BREAK");else{boss.health-=10+p.meleeStep*4;boss.flash=.1}hitStop=.03}if(p.meleeStep===3)for(const s of secrets)if(!s.opened&&overlap(hb,s))openSecret(s)}
function executeFinisher(player,target,label){if(target.finishing)return;target.finishing=true;hitStop=.16;shake(16);banner(label,"#fff077");say(player.id===0?"NOVA":"ECHO","BREAK!");burst(target.x+target.w/2,target.y+target.h/2,"#fff17a",70,430);target.health=0;player.invuln=Math.max(player.invuln,.8)}

/* ENEMIES */
function nearestPlayer(entity){let best=null,dist=Infinity;for(const p of players){if(!p.active||p.downed)continue;const d=Math.hypot(p.x-entity.x,p.y-entity.y);if(d<dist){dist=d;best=p}}return best}
function updateEnemies(dt){for(const e of enemies){if(e.dead){e.deathTimer-=dt;continue}e.flash=Math.max(0,e.flash-dt);e.hurtTimer=Math.max(0,e.hurtTimer-dt);e.slowTimer=Math.max(0,e.slowTimer-dt);if(e.health<=0){e.dead=true;e.deathTimer=.45;fragmentBurst(e.x+e.w/2,e.y+e.h/2,SECTORS[currentSector].enemyPalette[0],10);burst(e.x+e.w/2,e.y+e.h/2,"#ff986e",28,280);synergy=clamp(synergy+7,0,100);continue}if(Math.abs(e.knockX)>1||Math.abs(e.knockY)>1){e.x+=e.knockX*dt;e.y+=e.knockY*dt;e.knockY+=GRAVITY*.7*dt;e.knockX*=Math.pow(.04,dt);if(e.y>618){e.y=618;e.knockY=0}continue}if(e.stun>0){e.stun-=dt;continue}const target=nearestPlayer(e);if(!target)continue;const slow=e.slowTimer>0?.45:1;switch(e.type){case"walker":e.x+=Math.sign(target.x-e.x)*55*slow*dt;break;case"heavy":e.x+=Math.sign(target.x-e.x)*32*slow*dt;break;case"charger":e.x+=Math.sign(target.x-e.x)*150*slow*dt;break;case"interceptor":e.x+=Math.sign((target.x+target.vx*.35)-e.x)*115*slow*dt;break;case"drone":e.orbit+=dt*1.5;e.y+=Math.sin(e.orbit)*28*dt;break;case"orbiter":e.orbit+=dt*2;e.x+=Math.cos(e.orbit)*38*dt;e.y+=Math.sin(e.orbit)*38*dt;break;case"wallHunter":e.y+=Math.sign(target.y-e.y)*88*slow*dt;break}e.fireTimer-=dt;if(e.fireTimer<=0){hostileShot(e.x+e.w/2,e.y+e.h/2,target,e.type==="sniper"?470:320,e.type==="heavy"?15:11,"#ff5577",e.type==="sniper"?"gold":"blue");e.fireTimer=e.type==="sniper"?2.05:e.type==="turret"?1.4:e.type==="heavy"?2.65:2.2}for(const p of players){if(!p.active||p.downed||!overlap(e.rect(),p.rect()))continue;if(parryActive(p)){const perfect=perfectParry(p);e.stun=perfect?1.4:.8;knockEnemy(e,p.facing*(perfect?320:180),perfect?-260:-120);synergy=clamp(synergy+(perfect?10:5),0,100);if(perfect&&save.skills.reflexLoop)p.dashCharge=Math.max(p.dashCharge,DASH_T2);burst(p.x+p.w/2,p.y+p.h/2,perfect?"#ffe66b":"#c0f3ff",perfect?28:20,260);hitStop=perfect?.06:.035}else hurtPlayer(p,e.type==="heavy"?18:11)}}}

/* MINI-BOSSES */
function updateMiniBosses(dt){for(const m of miniBosses){if(m.dead)continue;const trigger=players.some(p=>p.active&&!p.downed&&p.x>=m.arenaStart&&p.x<=m.arenaEnd);if(trigger&&!m.active){m.active=true;cameraLock={start:m.arenaStart-120,end:m.arenaEnd+120};banner("ELITE — "+m.type.toUpperCase(),"#ffbb71");say("SYSTEM","Arena lockdown.")}if(!m.active)continue;m.flash=Math.max(0,m.flash-dt);if(m.health<=0){m.dead=true;cameraLock=null;fragmentBurst(m.x+m.w/2,m.y+m.h/2,"#ffd475",18);burst(m.x+m.w/2,m.y+m.h/2,"#ffd475",48,360);synergy=clamp(synergy+20,0,100);banner("ELITE CLEARED","#ffd478");continue}if(m.stun>0){m.stun-=dt;continue}const t=nearestPlayer(m);if(!t)continue;m.attackTimer-=dt;switch(m.type){case"bulwark":m.x+=Math.sign(t.x-m.x)*45*dt;break;case"vectorHound":m.x+=Math.sign(t.x-m.x)*130*dt;break;case"cliffStalker":m.y+=Math.sign(t.y-m.y)*98*dt;break;case"railSentinel":break}if(m.attackTimer<=0){hostileShot(m.x+m.w/2,m.y+m.h/2,t,m.type==="railSentinel"?570:390,m.type==="bulwark"?18:15,"#ffae69",m.type==="railSentinel"?"gold":"blue");m.attackTimer=m.type==="railSentinel"?1.65:1.2}}}

/* HAZARDS + SETPIECES */
function updateHazards(){for(const h of hazards){if(h.disabled){h.active=false;continue}const c=(worldClock+h.phase)%2.8;switch(h.type){case"laser":h.active=c<1.2;break;case"vent":h.active=c>.9&&c<1.55;break;case"spore":h.active=c<1.85;break;case"ice":h.active=c>.6&&c<1.15;break;case"lightning":h.active=c>1.4&&c<1.72;break;case"nullgrid":h.active=c<.95;break}if(!h.active)continue;for(const p of players){if(!p.active||p.downed||!overlap(p.rect(),h))continue;if(h.type==="spore")p.vx*=.94;else hurtPlayer(p,h.type==="lightning"?18:12)}}}
function updateSetpiece(dt){if(!setpiece)return;const leader=players.find(p=>p.active&&!p.downed);if(!leader)return;if(!setpiece.triggered&&leader.x>3550){setpiece.triggered=true;setpiece.active=true;setpiece.timer=7;banner(SECTORS[currentSector].setpiece.toUpperCase(),"#fff18a");say("SYSTEM","Environmental surge incoming.")}if(!setpiece.active)return;setpiece.timer-=dt;setpiece.phase+=dt;switch(setpiece.type){case"trainRush":for(const p of players)if(p.active&&!p.downed&&p.y>540&&Math.sin(setpiece.phase*4)>.6)hurtPlayer(p,14);break;case"furnaceSurge":if(Math.sin(setpiece.phase*3)>.5)hazards.forEach(h=>{if(h.type==="vent")h.active=true});break;case"vineBridge":movingPlatforms.forEach((m,i)=>{if(i%2===0)m.baseY+=Math.sin(setpiece.phase*2+i)*.2});break;case"iceCollapse":platforms.forEach((pl,i)=>{if(pl.type==="oneway"&&i%5===0&&leader.x>pl.x-200&&leader.x<pl.x+300)pl._shake=Math.sin(setpiece.phase*18)*3});break;case"lightningChase":if(Math.sin(setpiece.phase*7)>.72){const h={x:leader.x+rand(-160,160),y:220,w:80,h:440};for(const p of players)if(p.active&&overlap(p.rect(),h))hurtPlayer(p,16)}break;case"nullWarp":cameraX+=Math.sin(setpiece.phase*7)*.3;break}if(setpiece.timer<=0)setpiece.active=false}

/* BOSS */
function activateBoss(){if(boss&&!boss.dead)return;boss=new Boss(SECTORS[currentSector].boss);musicBossMode=true;cameraLock={start:WORLD_W-1180,end:WORLD_W};banner(SECTORS[currentSector].name+" — GUARDIAN","#ff8497");say(boss.type.toUpperCase(),"You will go no farther.")}
function chooseBossTelegraph(){const r=Math.random();let kind="blue";if(boss.phase>=2&&r>.6)kind="gold";if(boss.phase>=3&&r>.78)kind="red";boss.telegraph={kind,timer:kind==="red"?.6:.42}}
function executeBossAttack(){if(!boss)return;const t=nearestPlayer(boss);if(!t)return;const cx=boss.x+boss.w/2,cy=boss.y+boss.h/2,kind=boss.telegraph?.kind||"blue",parryType=kind,speed=kind==="red"?500:kind==="gold"?440:380,damage=kind==="red"?23:kind==="gold"?18:15;switch(boss.type){case"aegis":for(let i=-boss.phase;i<=boss.phase;i++){hostileShot(cx,cy,t,speed,damage,kind==="red"?"#ff4e63":kind==="gold"?"#ffd86d":"#72ddff",parryType);const s=shots[shots.length-1],a=Math.atan2(t.y-cy,t.x-cx)+i*.17;s.vx=Math.cos(a)*speed;s.vy=Math.sin(a)*speed}boss.state="shieldDash";boss.stateTimer=.55;break;case"cinder":for(let i=0;i<boss.phase+2;i++)hostileShot(cx,cy,t,speed+80,damage+2,kind==="gold"?"#ffd45d":"#ff7048",parryType);boss.state="rush";boss.stateTimer=.6;boss.vx=Math.sign(t.x-boss.x)*440;break;case"mycel":for(let i=0;i<8+boss.phase;i++){const a=Math.PI*2*i/(8+boss.phase);shots.push({x:cx,y:cy,vx:Math.cos(a)*(300+boss.phase*35),vy:Math.sin(a)*(300+boss.phase*35),r:8,friendly:false,tier:0,damage,life:5,color:kind==="gold"?"#ffe16d":"#75ffa0",parryable:kind!=="red",perfectOpportunity:kind==="gold"})}boss.state="hover";boss.stateTimer=.8;break;case"rime":for(let i=-3;i<=3;i++){const a=Math.PI/2+i*.16;shots.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:8,friendly:false,tier:0,damage,life:5,color:kind==="gold"?"#ffe26c":"#9ce9ff",parryable:kind!=="red",perfectOpportunity:kind==="gold"})}boss.state="blink";boss.stateTimer=.35;break;case"tempest":for(let i=0;i<10+boss.phase*3;i++){const a=rand(0,Math.PI*2);shots.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:8,friendly:false,tier:0,damage,life:5,color:kind==="gold"?"#ffe06c":"#e1fbff",parryable:kind!=="red",perfectOpportunity:kind==="gold"})}boss.state="swoop";boss.stateTimer=.7;boss.vx=Math.sign(t.x-boss.x)*380;boss.vy=-220;break;case"null":for(let i=0;i<12+boss.phase*2;i++){const a=Math.PI*2*i/(12+boss.phase*2)+worldClock*.4;shots.push({x:cx,y:cy,vx:Math.cos(a)*(speed+boss.phase*25),vy:Math.sin(a)*(speed+boss.phase*25),r:9,friendly:false,tier:0,damage:damage+2,life:5,color:kind==="gold"?"#ffe16a":"#d49aff",parryable:kind!=="red",perfectOpportunity:kind==="gold"})}boss.state="teleport";boss.stateTimer=.45;break}boss.telegraph=null;boss.attackTimer=Math.max(.5,1.55-boss.phase*.23)}
function updateBoss(dt){if(!boss||boss.dead)return;boss.flash=Math.max(0,boss.flash-dt);boss.stun=Math.max(0,boss.stun-dt);if(boss.health<=0){boss.health=0;boss.dead=true;cameraLock=null;fragmentBurst(boss.x+boss.w/2,boss.y+boss.h/2,"#fff083",28);burst(boss.x+boss.w/2,boss.y+boss.h/2,"#fff083",90,450);unlockBossReward(boss.type);banner(boss.type.toUpperCase()+" DEFEATED","#fff28a");say(boss.type.toUpperCase(),"...impossible.");musicBossMode=false;sectorCompleteTimer=2.6;return}const ratio=boss.health/boss.maxHealth,phase=ratio<.33?3:ratio<.66?2:1;if(phase!==boss.phase){boss.phase=phase;banner("BOSS PHASE "+phase,"#ff788e");say(boss.type.toUpperCase(),phase===2?"Enough restraint.":"I will erase you!");shake(8)}if(boss.stun>0)return;const t=nearestPlayer(boss);if(!t)return;if(boss.stateTimer>0){boss.stateTimer-=dt;switch(boss.state){case"shieldDash":boss.x+=Math.sign(t.x-boss.x)*260*dt;break;case"rush":boss.x+=boss.vx*dt;break;case"hover":boss.y=430+Math.sin(worldClock*4)*70;break;case"blink":if(boss.stateTimer<.18){boss.x=clamp(t.x+rand(-240,240),WORLD_W-1120,WORLD_W-180);boss.y=rand(330,510)}break;case"swoop":boss.x+=boss.vx*dt;boss.y+=boss.vy*dt;boss.vy+=700*dt;if(boss.y>465){boss.y=465;boss.vy=0}break;case"teleport":if(boss.stateTimer<.2){boss.x=clamp(t.x+rand(-300,300),WORLD_W-1120,WORLD_W-180);boss.y=rand(300,500)}break}return}boss.x+=Math.sign(t.x-boss.x)*(25+boss.phase*8)*dt;if(boss.telegraph){boss.telegraph.timer-=dt;if(boss.telegraph.timer<=0)executeBossAttack();return}boss.attackTimer-=dt;if(boss.attackTimer<=0)chooseBossTelegraph()}
function unlockBossReward(type){const map={aegis:["aegis","arc"],cinder:["cinder","magma"],mycel:["mycel","cyclone"],rime:["rime","cryo"],tempest:["tempest","volt"],null:["null","null"]},r=map[type];if(!r)return;if(!save.unlockedGuardians.includes(r[0]))save.unlockedGuardians.push(r[0]);if(!save.unlockedWeapons.includes(r[1]))save.unlockedWeapons.push(r[1]);save.skillPoints+=2;persist()}
function bossArenaHazards(){if(!boss||boss.dead||boss.phase===1)return[];const start=WORLD_W-1160,type=SECTORS[currentSector].hazard,list=[];if(boss.phase>=2)list.push({type,x:start+300,y:["laser","nullgrid"].includes(type)?330:580,w:80,h:["laser","nullgrid"].includes(type)?330:80,active:Math.sin(worldClock*4)>0});if(boss.phase>=3)list.push({type,x:start+650,y:["laser","nullgrid"].includes(type)?300:580,w:90,h:["laser","nullgrid"].includes(type)?360:80,active:Math.sin(worldClock*4+1.7)>.1});return list}

/* SHOT UPDATE */
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.returning){s.returnTimer-=dt;if(s.returnTimer<=0){const o=s.owner;if(o?.active){const n=norm(o.x+o.w/2-s.x,o.y+o.h/2-s.y);s.vx=lerp(s.vx,n.x*760,.08);s.vy=lerp(s.vy,n.y*760,.08)}}}if(s.mine){s.vy+=GRAVITY*.55*dt;if(s.y>625){s.y=625;s.vx=0;s.vy=0;s.mineArmed=true}}if(s.gravityWell&&s.friendly){for(const e of enemies){if(e.dead)continue;const dx=s.x-(e.x+e.w/2),dy=s.y-(e.y+e.h/2),d=Math.hypot(dx,dy);if(d<160&&d>1){e.x+=dx/d*62*dt;e.y+=dy/d*28*dt}}}if(s.life<=0){shots.splice(i,1);continue}if(s.mine&&s.mineArmed){const t=enemies.find(e=>!e.dead&&Math.hypot(e.x+e.w/2-s.x,e.y+e.h/2-s.y)<85+s.tier*18);if(t){t.health-=s.damage;t.stun=Math.max(t.stun,.45);burst(s.x,s.y,s.color,30,300);shots.splice(i,1);continue}}if(s.friendly&&s.tier>=1){for(let j=shots.length-1;j>=0;j--){if(j===i)continue;const o=shots[j];if(o.friendly)continue;const dx=s.x-o.x,dy=s.y-o.y;if(dx*dx+dy*dy<(s.r+o.r)*(s.r+o.r)){burst(o.x,o.y,"#d9faff",12,180);shots.splice(j,1);synergy=clamp(synergy+1.5,0,100);if(j<i)i--}}}if(!shots[i])continue;if(s.friendly){let remove=false;if(s.tier===3)for(const secret of secrets)if(!secret.opened&&circleRect(s,secret))openSecret(secret);for(const d of destructibles){if(d.broken||!circleRect(s,d.rect()))continue;damageDestructible(d,s.damage*(s.tier===3?1.8:.6),s.tier);if(!s.pierce){remove=true;break}}for(const e of enemies){if(remove||e.dead||!circleRect(s,e.rect()))continue;e.health-=s.damage;e.flash=.1;e.hurtTimer=.12;if(s.slow)e.slowTimer=Math.max(e.slowTimer,1.7+s.tier*.35);if(s.tier>=2)knockEnemy(e,Math.sign(s.vx)*(70+s.tier*30),-30*s.tier);damageText(e.x,e.y-5,Math.round(s.damage),s.tier===3?"#fff47c":"#8cecff");burst(s.x,s.y,s.color,10+s.tier*4,220);synergy=clamp(synergy+1,0,100);if(!s.pierce){remove=true;break}}for(const m of miniBosses){if(remove||!m.active||m.dead)continue;if(circleRect(s,m.rect())){m.health-=s.damage;m.flash=.1;if(!s.pierce)remove=true}}if(!remove&&boss&&!boss.dead&&circleRect(s,boss.rect())){boss.health-=s.damage;boss.flash=.1;damageText(boss.x,boss.y-12,Math.round(s.damage),s.tier===3?"#fff47c":"#9eeeff");if(!s.pierce)remove=true}if(remove)shots.splice(i,1)}else{for(const p of players){if(!p.active||p.downed||!circleRect(s,p.rect()))continue;if(parryActive(p)&&s.parryable!==false){const perfect=perfectParry(p),bonus=s.perfectOpportunity&&perfect;s.friendly=true;s.owner=p;s.vx*=-1.25;s.vy*=-1.25;s.damage=bonus?48:perfect?34:20;s.tier=bonus||perfect?3:2;s.color=bonus?"#ffd85e":perfect?"#ffe36e":"#90ecff";synergy=clamp(synergy+(bonus?14:perfect?10:4),0,100);if(perfect&&save.skills.reflexLoop)p.dashCharge=Math.max(p.dashCharge,DASH_T2);burst(s.x,s.y,s.color,bonus?34:perfect?28:18,270);hitStop=bonus?.085:perfect?.065:.03;shake(bonus?12:perfect?9:5);continue}hurtPlayer(p,s.damage);shots.splice(i,1);break}}}}

/* TEAM MOVES */
function teamCenter(){return{x:(players[0].x+players[1].x)/2,y:(players[0].y+players[1].y)/2}}
function damageArea(c,r,dmg){for(const e of enemies){if(e.dead)continue;if(Math.hypot(e.x-c.x,e.y-c.y)<=r){e.health-=dmg;e.stun=Math.max(e.stun,1);knockEnemy(e,Math.sign(e.x-c.x)*240,-180)}}for(const m of miniBosses){if(m.active&&!m.dead&&Math.hypot(m.x-c.x,m.y-c.y)<=r){m.health-=dmg*.8;m.stun=Math.max(m.stun,.5)}}if(boss&&!boss.dead&&Math.hypot(boss.x-c.x,boss.y-c.y)<=r)boss.health-=dmg*.65}
function triggerSynergy(){const a=players[0],b=players[1];if(synergy<100||!a.active||!b.active||a.downed||b.downed)return;synergy=0;a.invuln=1.25;b.invuln=1.25;const bothFire=a.fireCharge>=SHOT_T2&&b.fireCharge>=SHOT_T2,bothDash=a.dashCharge>=DASH_T3&&b.dashCharge>=DASH_T3,c=teamCenter();if(bothDash){banner("VECTOR CROSS","#74eaff");say("NOVA","NOW!");a.dashTier=3;b.dashTier=3;a.dashDir=norm(1,-.15);b.dashDir=norm(-1,.15);a.dashTimer=.7;b.dashTimer=.7;damageArea(c,850,85)}else if(bothFire){banner("RESONANCE BURST","#fff17d");damageArea(c,900,105);burst(c.x,c.y,"#fff17d",90,470);shake(18)}else{banner("CROSSFIRE NOVA","#fff384");damageArea(c,700,68);shake(12)}}

/* CO-OP + CHECKPOINTS */
function joinPlayerTwo(){const p=players[1],h=players[0];p.active=true;p.x=h.x-48;p.y=h.y;p.health=p.maxHealth;p.downed=false;banner("ECHO JOINED","#ffac5d")}
function respawnCheckpoint(){const cp=checkpoints[clamp(save.checkpoint,0,checkpoints.length-1)]||checkpoints[0];players.forEach((p,i)=>{if(!p.active)return;p.x=cp.x-i*45;p.y=cp.y-p.h;p.vx=0;p.vy=0;p.health=p.maxHealth;p.downed=false;p.invuln=1})}
function updateCheckpoint(){const l=players.find(p=>p.active&&!p.downed);if(!l)return;for(let i=checkpoints.length-1;i>=0;i--){if(l.x>=checkpoints[i].x&&i>save.checkpoint){save.checkpoint=i;persist();banner("CHECKPOINT "+(i+1),"#78ffc5");break}}}
function updateAct(){const l=players.find(p=>p.active&&!p.downed);if(!l)return;const act=l.x<2500?0:l.x<5000?1:2;if(act!==currentAct){currentAct=act;banner(SECTORS[currentSector].acts[currentAct],"#81e8ff");say("SYSTEM","Entering "+SECTORS[currentSector].acts[currentAct]+".");musicStep=0}}

/* CAMERA */
function updateMovingPlatforms(){for(const p of movingPlatforms)p.update()}
function updateCamera(dt){const active=players.filter(p=>p.active);if(!active.length)return;const avg=active.reduce((s,p)=>s+p.x,0)/active.length;let minX=0,maxX=WORLD_W-VW;if(cameraLock){minX=clamp(cameraLock.start,0,WORLD_W-VW);maxX=clamp(cameraLock.end-VW,minX,WORLD_W-VW)}else{const room=ROOM_BOUNDS.findIndex(([s,e])=>avg>=s&&avg<e);cameraRoom=room>=0?room:cameraRoom;const b=ROOM_BOUNDS[cameraRoom];minX=clamp(b[0],0,WORLD_W-VW);maxX=clamp(b[1]-VW,minX,WORLD_W-VW)}cameraX=lerp(cameraX,clamp(avg-VW*.42,minX,maxX),1-Math.pow(.008,dt))}

/* EFFECT UPDATE */
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=afterimages.length-1;i>=0;i--){afterimages[i].life-=dt;if(afterimages[i].life<=0)afterimages.splice(i,1)}for(let i=speedLines.length-1;i>=0;i--){const s=speedLines[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0)speedLines.splice(i,1)}for(let i=damageTexts.length-1;i>=0;i--){const d=damageTexts[i];d.y-=35*dt;d.life-=dt;if(d.life<=0)damageTexts.splice(i,1)}for(let i=banners.length-1;i>=0;i--){banners[i].life-=dt;if(banners[i].life<=0)banners.splice(i,1)}for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=GRAVITY*.8*dt;d.rot+=d.vr*dt;d.life-=dt;if(d.life<=0)debris.splice(i,1)}if(subtitle){subtitle.life-=dt;if(subtitle.life<=0)subtitle=null}}

/* SECTOR START */
function spawnEnemies(){enemies=[];const positions=[[390,610],[710,520],[1130,610],[1510,400],[1830,610],[2450,610],[2770,450],[3380,610],[3740,320],[4650,610],[5060,390],[5770,610],[6280,330]];positions.forEach(([x,y],i)=>{const type=ENEMY_TYPES[(i+currentSector*2)%ENEMY_TYPES.length];enemies.push(new Enemy(x,y,type))})}
function startSector(){currentAct=0;boss=null;sectorCompleteTimer=0;shots.length=0;musicBossMode=false;musicStep=0;save.checkpoint=0;cameraX=0;cameraLock=null;buildLevel();spawnEnemies();spawnPickups();respawnCheckpoint();banner(SECTORS[currentSector].name,"#7ce8ff");say("SYSTEM",SECTORS[currentSector].acts[0]);persist()}
function advanceSector(){currentSector++;if(currentSector>=SECTORS.length){currentSector=0;banner("CAMPAIGN COMPLETE","#fff27a")}startSector()}

/* WORLD UPDATE */
function updateGame(i1,i2,dt){if(hitStop>0){hitStop-=dt;updateEffects(dt);return}updateMovingPlatforms();updatePlayer(players[0],i1,dt);updatePlayer(players[1],i2,dt);updateEnemies(dt);updateMiniBosses(dt);updateShots(dt);updateHazards();updateSetpiece(dt);updateSecrets(dt);for(const h of bossArenaHazards()){if(!h.active)continue;for(const p of players)if(p.active&&!p.downed&&overlap(p.rect(),h))hurtPlayer(p,15)}updatePickups();updateCheckpoint();updateAct();if(players.some(p=>p.active&&p.x>WORLD_W-1080))activateBoss();updateBoss(dt);if(boss?.dead&&sectorCompleteTimer>0){sectorCompleteTimer-=dt;if(sectorCompleteTimer<=0){advanceSector();return}}updateMusic(dt);updateEffects(dt);updateCamera(dt);screenShake=Math.max(0,screenShake-dt*35);if(!players.some(p=>p.active&&!p.downed))respawnCheckpoint()}

/* DRAW BACKGROUND */
function drawBackground(){const s=SECTORS[currentSector],g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,s.colors[0]);g.addColorStop(.65,s.colors[1]);g.addColorStop(1,"#050812");ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);ctx.save();ctx.filter="blur(4px)";ctx.globalAlpha=.25;for(let i=0;i<25;i++){const px=(((i*185-cameraX*.15)%(VW+300)+VW+300)%(VW+300))-150,h=130+(i*71)%300;ctx.fillStyle=i%2?s.colors[1]:s.colors[2];ctx.fillRect(px,640-h,120,h)}ctx.restore();ctx.globalAlpha=.27;for(let i=0;i<20;i++){const px=(((i*260-cameraX*.31)%(VW+420)+VW+420)%(VW+420))-180;ctx.fillStyle="#203852";ctx.fillRect(px,470+(i%4)*35,150,220)}ctx.globalAlpha=1;const pc=currentSector===1?"#ff8a54":currentSector===2?"#85e68c":currentSector===3?"#c6edff":currentSector===4?"#e5f7ff":currentSector===5?"#d697ff":"#76dfff";ctx.globalAlpha=.28;for(let i=0;i<18;i++){const x=(i*107+worldClock*(10+currentSector*4)-cameraX*.18)%VW,y=(i*71+Math.sin(worldClock+i)*40)%620;ctx.fillStyle=pc;ctx.fillRect(x,y,2+i%3,2+i%3)}ctx.globalAlpha=1;ctx.font="bold 13px monospace";ctx.fillStyle="#88abc5";ctx.fillText(SECTORS[currentSector].name+" // "+SECTORS[currentSector].acts[currentAct],30,140)}

/* DRAW WORLD GEOMETRY */
function drawPlatforms(){for(const p of platforms){const x=worldX(p.x);if(x+p.w<0||x>VW)continue;ctx.fillStyle=p.type==="oneway"?"#294b69":"#233449";ctx.fillRect(x,p.y+(p._shake||0),p.w,p.h);ctx.fillStyle=p.type==="oneway"?"#6dd8fa":"#50718c";ctx.fillRect(x,p.y+(p._shake||0),p.w,3)}for(const p of movingPlatforms){const x=worldX(p.x);ctx.fillStyle="#315a78";ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle="#93eaff";ctx.fillRect(x,p.y,p.w,3);ctx.fillStyle="#4d7c9d";ctx.fillRect(x+p.w/2-10,p.y+6,20,5)}}
function drawDestructibles(){for(const d of destructibles){if(d.broken)continue;const x=worldX(d.x);ctx.fillStyle=d.kind==="conduit"?"#31596c":"#73583c";ctx.fillRect(x,d.y,d.w,d.h);ctx.strokeStyle=d.kind==="conduit"?"#68e9ff":"#d9ba84";ctx.strokeRect(x+3,d.y+3,d.w-6,d.h-6);if(d.kind==="conduit"){ctx.fillStyle="#70eaff";ctx.fillRect(x+d.w/2-3,d.y+10,6,d.h-20)}}}

function drawHazard(h){if(!h.active||h.disabled)return;const x=worldX(h.x);switch(h.type){case"laser":ctx.fillStyle="#ff3d6b88";ctx.fillRect(x,h.y,h.w,h.h);ctx.fillStyle="#ff7191";ctx.fillRect(x+h.w/2-3,h.y,6,h.h);break;case"vent":ctx.fillStyle="#ff723f99";ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+h.w/2,h.y-60);ctx.lineTo(x+h.w,h.y+h.h);ctx.fill();break;case"spore":ctx.fillStyle="#77e99644";ctx.fillRect(x,h.y,h.w,h.h);break;case"ice":ctx.fillStyle="#b7edff99";ctx.beginPath();ctx.moveTo(x,h.y);ctx.lineTo(x+h.w/2,h.y+h.h);ctx.lineTo(x+h.w,h.y);ctx.fill();break;case"lightning":ctx.fillStyle="#eef9ffaa";ctx.fillRect(x+h.w/2-5,h.y,10,h.h);break;case"nullgrid":ctx.fillStyle="#ca73ff88";ctx.fillRect(x,h.y,h.w,h.h);break}}
function drawHazards(){hazards.forEach(drawHazard);bossArenaHazards().forEach(drawHazard)}
function drawPickups(){for(const item of pickups){if(item.taken)continue;const x=worldX(item.x);let c="#fff";if(item.type.includes("health"))c="#78ff9b";if(item.type==="power")c="#ffda65";if(item.type==="velocity")c="#65e8ff";if(item.type==="barrier")c="#8cefff";if(item.type==="synergy")c="#ff83ed";if(item.type==="overcharge")c="#fff35f";const pulse=8+Math.sin(worldClock*6)*2;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,item.y,pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.24;ctx.beginPath();ctx.arc(x,item.y,pulse*2.1,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}

/* DRAW PLAYER */
function playerState(p){if(p.landingTimer>0)return"land";if(p.slideTimer>0)return"slide";if(p.dashTimer>0)return"dash";if(parryActive(p))return"parry";if(p.meleeTimer>0){if(!p.grounded)return p.airMeleeStep===3?"dive":p.airMeleeStep===2?"air2":"air1";return"melee"+p.meleeStep}if(!p.grounded&&(p.touchWallLeft||p.touchWallRight))return"wall";if(!p.grounded)return p.vy<0?"jump":"fall";if(p.crouching)return"crouch";if(Math.abs(p.vx)>40)return Math.sign(p.vx)===p.facing?"run":"backpedal";return"idle"}
function drawPlayer(p){if(!p.active)return;const x=worldX(p.x);if(p.downed){ctx.fillStyle="#344052";ctx.fillRect(x,p.y+p.h-14,42,14);ctx.fillStyle="#ff7b8d";ctx.font="bold 11px monospace";ctx.fillText("REVIVE "+Math.floor(p.reviveProgress*100)+"%",x-10,p.y-10);return}const state=playerState(p),si=Math.max(0,PLAYER_STATES.indexOf(state)),speed=state==="run"?12:state.startsWith("melee")||state.startsWith("air")||state==="dive"?14:7,frame=Math.floor(worldClock*speed)%4,row=p.id*PLAYER_STATES.length+si;ctx.save();if(p.facing<0){ctx.translate(x+PW,p.y+2);ctx.scale(-1,1);ctx.drawImage(playerAtlas,frame*PW,row*PH,PW,PH,0,0,PW,PH)}else ctx.drawImage(playerAtlas,frame*PW,row*PH,PW,PH,x,p.y+2,PW,PH);ctx.restore();const cx=x+p.w/2,cy=p.y+p.h/2;if(p.barrier>0){ctx.strokeStyle="#76eaff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,32,0,Math.PI*2);ctx.stroke()}if(p.dashCharge>.04){const tier=dashTier(p.dashCharge);ctx.strokeStyle=tier===3?"#fff36e":tier===2?"#65e9ff":"#5a9fff";ctx.lineWidth=1+tier;ctx.beginPath();ctx.arc(cx,cy,24+tier*5,0,Math.PI*2);ctx.stroke()}if(p.fireCharge>.08){ctx.strokeStyle=p.fireCharge>=SHOT_T3?"#fff36a":"#91efff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,19+Math.min(p.fireCharge,2)*7,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle="#dffaff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy-4);ctx.lineTo(cx+p.aimX*29,cy-4+p.aimY*29);ctx.stroke();const rx=cx+p.aimX*65,ry=cy+p.aimY*65;ctx.strokeStyle="#ffffffaa";ctx.lineWidth=1;ctx.beginPath();ctx.arc(rx,ry,6,0,Math.PI*2);ctx.stroke()}

/* DRAW ENEMIES/BOSSES */
function drawEnemies(){for(const e of enemies){if(e.dead&&e.deathTimer<=0)continue;const x=worldX(e.x);if(x<-100||x>VW+100)continue;const ti=Math.max(0,ENEMY_TYPES.indexOf(e.type)),state=e.dead?2:e.hurtTimer>0?1:0,frame=Math.floor(worldClock*(e.type==="charger"?12:6))%4,row=currentSector*ENEMY_TYPES.length*3+ti*3+state;ctx.drawImage(enemyAtlas,frame*EW,row*EH,EW,EH,x-2,e.y-4,EW,EH);if(e.stun>0){ctx.fillStyle="#fff178";ctx.font="11px monospace";ctx.fillText("✦ ✦",x+3,e.y-8)}}}

function drawShots(){for(const s of shots){const x=worldX(s.x);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x,s.y,s.r,0,Math.PI*2);ctx.fill();if(s.perfectOpportunity){ctx.strokeStyle="#ffd95e";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,s.y,s.r+5,0,Math.PI*2);ctx.stroke()}if(s.parryable===false){ctx.strokeStyle="#ff4b60";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,s.y,s.r+5,0,Math.PI*2);ctx.stroke()}}}

function updateEnvironmentArt(dt){ENV_STATE.time+=dt;if(ENV_STATE.sector!==currentSector)rebuildEnvironmentArt();ENV_STATE.lastAct=currentAct;let target=["rainHeavy","storm","embersHeavy"].includes(currentActVisual().weather)?58:["rain","snow","spores","nullFlux"].includes(currentActVisual().weather)?40:24;while(ENV_STATE.weather.length<target)spawnWeather();for(let i=ENV_STATE.weather.length-1;i>=0;i--){const p=ENV_STATE.weather[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.type==="leaves")p.x+=Math.sin(ENV_STATE.time*3+i)*20*dt;if(p.type.startsWith("null")){p.x+=Math.sin(ENV_STATE.time+i)*14*dt;p.y+=Math.cos(ENV_STATE.time*1.3+i)*9*dt}if(p.life<=0||p.y>VH+60||p.x<-120||p.x>VW+120)ENV_STATE.weather.splice(i,1)}if(currentSector===4){ENV_STATE.lightningTimer-=dt;if(ENV_STATE.lightningTimer<=0){ENV_STATE.lightningFlash=currentAct===2?.22:.12;ENV_STATE.lightningTimer=currentAct===2?rand(.9,2):rand(2,4)}}ENV_STATE.lightningFlash=Math.max(0,ENV_STATE.lightningFlash-dt)}
function drawWeather(){for(const p of ENV_STATE.weather){ctx.globalAlpha=p.alpha;if(["rain","rainHeavy","storm"].includes(p.type)){ctx.strokeStyle="#d8f1ff";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.size*.35,p.y-p.size);ctx.stroke()}else if(p.type.includes("embers")){ctx.fillStyle="#ff914c";ctx.fillRect(p.x,p.y,p.size,p.size)}else if(["snow","frost","iceDust"].includes(p.type)){ctx.fillStyle="#e8fbff";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill()}else if(p.type==="leaves"){ctx.fillStyle="#66aa69";ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ENV_STATE.time+p.x*.01);ctx.fillRect(-p.size,-1.5,p.size*2,3);ctx.restore()}else if(p.type.includes("spores")){ctx.fillStyle="#a7ffac";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill()}else if(p.type.startsWith("null")){ctx.fillStyle="#d28aff";ctx.fillRect(p.x,p.y,p.size,p.size)}else if(["steam","steamHot","haze"].includes(p.type)){ctx.fillStyle=p.type==="steamHot"?"#ffb381":"#dceaf1";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill()}else if(p.type==="wind"){ctx.strokeStyle="#d9f7ff";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.size,p.y);ctx.stroke()}}ctx.globalAlpha=1;if(ENV_STATE.lightningFlash>0){const a=clamp(ENV_STATE.lightningFlash/.22,0,1);ctx.fillStyle=`rgba(215,236,255,${a*.22})`;ctx.fillRect(0,0,VW,VH)}}

drawBackground=function(){const s=SECTORS[currentSector],m=sectorMaterial(),v=currentActVisual(),g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,s.colors[0]);g.addColorStop(.58,s.colors[1]);g.addColorStop(1,m.shadow);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);ctx.save();ctx.filter="blur(6px)";ctx.globalAlpha=.12+v.atm;for(let i=0;i<18;i++){const x=((i*260-cameraX*.06+12000)%(VW+450))-220,h=120+((i*83+currentSector*47)%330);ctx.fillStyle=i%2?m.dark:m.atmospheric;ctx.fillRect(x,620-h,145+(i*31)%80,h)}ctx.restore();drawEnvironmentLayer("far",.13);drawEnvironmentLayer("landmark",.22);drawEnvironmentLayer("mid",.38);const haze=ctx.createLinearGradient(0,280,0,VH);haze.addColorStop(0,"#ffffff00");haze.addColorStop(1,m.atmospheric+"22");ctx.fillStyle=haze;ctx.fillRect(0,280,VW,VH-280);if(currentSector===5){ctx.strokeStyle="rgba(206,129,255,.07)";for(let i=0;i<9;i++){const yy=100+i*60+Math.sin(ENV_STATE.time*.7+i)*8;ctx.beginPath();ctx.moveTo(0,yy);for(let x=0;x<VW;x+=80)ctx.lineTo(x,yy+Math.sin(x*.015+ENV_STATE.time+i)*6);ctx.stroke()}}ctx.font="bold 13px monospace";ctx.fillStyle=m.accent+"bb";ctx.fillText(s.name+" // "+v.name,30,140)};

drawPlatforms=function(){__v098_drawPlatforms_fidelity();const m=sectorMaterial();for(const p of platforms){const x=worldX(p.x);if(x+p.w<0||x>VW)continue;if(p.type==="oneway"){ctx.globalAlpha=.14;ctx.strokeStyle=m.metal;ctx.lineWidth=3;for(let px=x+25;px<x+p.w-20;px+=70){ctx.beginPath();ctx.moveTo(px,p.y+p.h);ctx.lineTo(px+18,p.y+p.h+25);ctx.lineTo(px+36,p.y+p.h);ctx.stroke()}ctx.globalAlpha=1}if(currentSector===3){const sweep=(worldClock*75+p.x*.2)%(p.w+140)-70,gg=ctx.createLinearGradient(x+sweep-40,0,x+sweep+40,0);gg.addColorStop(0,"#fff0");gg.addColorStop(.5,"#ffffff55");gg.addColorStop(1,"#fff0");ctx.fillStyle=gg;ctx.fillRect(x,p.y,p.w,3)}else if(currentSector===4){ctx.globalAlpha=.12;ctx.fillStyle=m.accent;ctx.fillRect(x,p.y+3,p.w,2);ctx.globalAlpha=1}else if(currentSector===0&&currentAct===2){ctx.globalAlpha=.1;ctx.fillStyle="#fff";ctx.fillRect(x+5,p.y+4,Math.max(0,p.w-10),1);ctx.globalAlpha=1}}};

/* ---------- LIGHTING & RENDERING ---------- */
const LIGHT_CANVAS=document.createElement("canvas"),lightCtx=LIGHT_CANVAS.getContext("2d");LIGHT_CANVAS.width=VW;LIGHT_CANVAS.height=VH;const DISTORT_CANVAS=document.createElement("canvas"),distortCtx=DISTORT_CANVAS.getContext("2d");DISTORT_CANVAS.width=VW;DISTORT_CANVAS.height=VH;
const RENDER_LIGHTS=[];let renderExposureFlash=0,renderPhasePulse=0;

function hex6(c){if(/^#[0-9a-f]{6}$/i.test(c||""))return c;if(/^#[0-9a-f]{3}$/i.test(c||""))return"#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return"#ffffff"}
function rgba(c,a){c=hex6(c);return`rgba(${parseInt(c.slice(1,3),16)},${parseInt(c.slice(3,5),16)},${parseInt(c.slice(5,7),16)},${a})`}
function spawnRenderLight(x,y,r,color,intensity=.6,life=.2){if(!save.settings.renderFX)return;RENDER_LIGHTS.push({x,y,r,color:hex6(color),intensity,life,maxLife:life});if(RENDER_LIGHTS.length>80)RENDER_LIGHTS.splice(0,RENDER_LIGHTS.length-80)}
function updateRenderLights(dt){for(let i=RENDER_LIGHTS.length-1;i>=0;i--){RENDER_LIGHTS[i].life-=dt;if(RENDER_LIGHTS[i].life<=0)RENDER_LIGHTS.splice(i,1)}renderExposureFlash=Math.max(0,renderExposureFlash-dt);renderPhasePulse=Math.max(0,renderPhasePulse-dt)}
function lightBlob(c,x,y,r,color,a){if(r<=0||a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(.3,rgba(color,a*.55));g.addColorStop(1,rgba(color,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.28);c.fill()}
function collectLights(){lightCtx.clearRect(0,0,VW,VH);for(const l of RENDER_LIGHTS){const x=worldX(l.x),k=clamp(l.life/l.maxLife,0,1);if(x+l.r<0||x-l.r>VW)continue;lightBlob(lightCtx,x,l.y,l.r,l.color,l.intensity*k)}for(const p of players){if(!p.active||p.downed)continue;const x=worldX(p.x+p.w/2),y=p.y+p.h/2;if(p.fireCharge>.08){const w=p.weapon(),q=clamp(p.fireCharge/SHOT_T3,0,1);lightBlob(lightCtx,x+p.aimX*22,y+p.aimY*22,22+q*32,w.color,.17+q*.2)}if(p.dashTier===3&&p.dashTimer>0)lightBlob(lightCtx,x,y,42,p.color,.16)}for(const s of shots){const x=worldX(s.x);if(x<-80||x>VW+80)continue;lightBlob(lightCtx,x,s.y,14+(s.r||4)*2.5+(s.tier||0)*10,s.color||(s.friendly?"#8feaff":"#ff6a7e"),(s.friendly?.12:.08)+(s.tier||0)*.055)}for(const item of pickups){if(item.taken)continue;const x=worldX(item.x);if(x<-60||x>VW+60)continue;lightBlob(lightCtx,x,item.y,25,item.type.includes("health")?"#78ff9b":item.type==="power"?"#ffda65":item.type==="synergy"?"#ff83ed":"#7eeaff",.08)}if(boss&&!boss.dead){const gp=guardianPalette(boss.type),x=worldX(boss.x+boss.w/2),y=boss.y+boss.h/2;lightBlob(lightCtx,x,y,45+boss.phase*8,gp.trim,.08+boss.phase*.025);if(boss.guardianBrain?.weakPointOpen){const pos=guardianWeakPointPosition();lightBlob(lightCtx,worldX(pos.x),pos.y,50,gp.core,.26)}}if(ENV_STATE.lightningFlash>0){const a=clamp(ENV_STATE.lightningFlash/.22,0,1);lightCtx.fillStyle=`rgba(220,240,255,${a*.2})`;lightCtx.fillRect(0,0,VW,VH)}}
function drawDynamicLighting(){if(!save.settings.renderFX)return;collectLights();ctx.save();ctx.globalCompositeOperation="screen";if(save.settings.bloom){ctx.globalAlpha=.56;ctx.filter="blur(11px)";ctx.drawImage(LIGHT_CANVAS,0,0);ctx.filter="none"}ctx.globalAlpha=.64;ctx.drawImage(LIGHT_CANVAS,0,0);ctx.restore()}
const __v098_fireWeapon_light=fireWeapon;fireWeapon=function(player,tier){const w=player.weapon();spawnRenderLight(player.x+player.w/2+player.aimX*27,player.y+player.h/2+player.aimY*27,30+tier*17,w.color,.3+tier*.11,.11+tier*.035);__v098_fireWeapon_light(player,tier)};

/* ---------- CONTACT SHADOWS ---------- */
function groundBelow(e){const bottom=e.y+e.h;let closest=null;for(const p of [...platforms,...movingPlatforms]){if(e.x+e.w<p.x||e.x>p.x+p.w||p.y<bottom-3)continue;if(closest===null||p.y<closest)closest=p.y}if(closest===null&&bottom<=660)closest=660;return closest}
function drawShadow(e,f=.8,a=.2){if(!e||!save.settings.renderFX)return;const g=groundBelow(e);if(g===null)return;const fade=clamp(1-(g-(e.y+e.h))/280,0,1);if(fade<.02)return;const w=e.w*f*(.55+fade*.45),x=worldX(e.x+e.w/2);ctx.save();ctx.globalAlpha=a*fade;ctx.filter="blur(3px)";ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x,g+2,w,Math.max(3,w*.16),0,0,6.28);ctx.fill();ctx.restore()}
